<!--
  PaymentRefundPrompt.html — the refund prompt for screens that cancel an
  appointment but do not carry the full payment panel.

  Included by Dashboard.html, dayOverview.html and Visualization.html with
  <?!= include('PaymentRefundPrompt') ?>.

  Deliberately dependency-free: these three pages do not all load the Bootstrap
  JS bundle, so the modal is plain DOM with its own styles and its own class
  prefix (prp-) to avoid colliding with each host page's CSS.

  Usage, after a cancellation returns:

      PaymentRefundPrompt.handle(response, { onDone: loadAppointments });

  It does nothing at all unless the cancelled appointment actually holds a
  refundable payment, so it is safe to call unconditionally.
-->
<style>
  .prp-overlay {
    position: fixed;
    inset: 0;
    background: rgba(15, 23, 42, 0.55);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 30000;
    padding: 16px;
  }
  .prp-modal {
    background: #fff;
    border-radius: 10px;
    width: 100%;
    max-width: 520px;
    box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    font-family: inherit;
    max-height: 90vh;
    overflow-y: auto;
  }
  .prp-header {
    padding: 16px 20px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .prp-title {
    margin: 0;
    font-size: 17px;
    font-weight: 700;
    color: #111827;
  }
  .prp-close {
    background: none;
    border: none;
    font-size: 24px;
    line-height: 1;
    cursor: pointer;
    color: #6b7280;
  }
  .prp-body {
    padding: 18px 20px;
  }
  .prp-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 14px;
    font-size: 14px;
  }
  .prp-table td {
    padding: 4px 0;
  }
  .prp-table td:first-child {
    color: #6b7280;
    padding-right: 14px;
    white-space: nowrap;
  }
  .prp-table td:last-child {
    font-weight: 600;
    color: #111827;
  }
  .prp-field {
    margin-bottom: 12px;
  }
  .prp-field label {
    display: block;
    font-size: 13px;
    color: #374151;
    margin-bottom: 4px;
  }
  .prp-field select,
  .prp-field input,
  .prp-field textarea {
    width: 100%;
    padding: 7px 10px;
    border: 1px solid #d1d5db;
    border-radius: 6px;
    font-size: 14px;
    font-family: inherit;
    box-sizing: border-box;
  }
  .prp-note {
    font-size: 13px;
    color: #92400e;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 6px;
    padding: 8px 10px;
  }
  .prp-error {
    font-size: 13px;
    color: #b02a37;
    margin-top: 8px;
    min-height: 18px;
  }
  .prp-footer {
    padding: 14px 20px;
    border-top: 1px solid #e5e7eb;
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    flex-wrap: wrap;
  }
  .prp-btn {
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid transparent;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .prp-btn-danger {
    background: #b02a37;
    color: #fff;
  }
  .prp-btn-secondary {
    background: #fff;
    color: #374151;
    border-color: #d1d5db;
  }
  .prp-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }
</style>

<script>
  window.PaymentRefundPrompt = (function () {
    function token() {
      return window.sessionToken;
    }

    /**
     * Call with the response from cancelAppointmentWithPaymentCheck().
     * Silent unless the cancelled appointment holds a refundable payment.
     *
     * @param {Object} response
     * @param {Object} [options]
     * @param {Function} [options.onDone]  re-render the host list afterwards
     */
    function handle(response, options) {
      options = options || {};
      if (!response || !response.success) return;
      if (!response.payment || !response.payment.hasPayment) return;
      if (!response.payment.refundable) return;

      open(response.payment.paymentRef, options);
    }

    /** Open the prompt for a known payment reference. */
    function open(paymentRef, options) {
      options = options || {};
      google.script.run
        .withSuccessHandler(function (ctx) {
          if (!ctx || !ctx.success || !ctx.refundable) return;
          render(ctx, options);
        })
        .withFailureHandler(function () {
          // Refund details unavailable — the cancellation already succeeded, and
          // the refund can still be issued from the Cancelled list.
        })
        .getRefundContext(paymentRef, token());
    }

    function render(ctx, options) {
      close();

      var rows = [
        ["Patient", ctx.patientName],
        ["MRD No", ctx.mrdNo],
        ["Appointment", ctx.appointmentDate + " " + (ctx.appointmentTime || "")],
        ["Amount paid", ctx.paidAmountDisplay],
        ["Original Payment ID", ctx.providerPaymentId],
        ["Refundable now", ctx.refundableAmountDisplay],
      ]
        .map(function (row) {
          return "<tr><td>" + row[0] + "</td><td>" + (row[1] || "&mdash;") + "</td></tr>";
        })
        .join("");

      var reasons = (ctx.reasons || [])
        .map(function (reason) {
          return '<option value="' + reason + '">' + reason + "</option>";
        })
        .join("");

      var overlay = document.createElement("div");
      overlay.className = "prp-overlay";
      overlay.id = "prpOverlay";
      overlay.innerHTML =
        '<div class="prp-modal">' +
        '<div class="prp-header"><h3 class="prp-title">This appointment was paid for</h3>' +
        '<button class="prp-close" onclick="PaymentRefundPrompt.close()">&times;</button></div>' +
        '<div class="prp-body">' +
        '<table class="prp-table"><tbody>' +
        rows +
        "</tbody></table>" +
        '<div class="prp-field"><label for="prp_amount">Refund amount (Rs)</label>' +
        '<input type="number" id="prp_amount" min="1" step="1" value="' +
        ctx.refundableAmountPaise / 100 +
        '"></div>' +
        '<div class="prp-field"><label for="prp_reason">Reason</label>' +
        '<select id="prp_reason"><option value="">Select a reason...</option>' +
        reasons +
        "</select></div>" +
        '<div class="prp-field"><label for="prp_remarks">Remarks (optional)</label>' +
        '<textarea id="prp_remarks" rows="2"></textarea></div>' +
        '<div class="prp-note">The refund goes back through the original payment method. ' +
        "Choosing <strong>Not now</strong> leaves the money with the clinic — you can still refund it later from the Cancelled list.</div>" +
        '<div class="prp-error" id="prp_error"></div>' +
        "</div>" +
        '<div class="prp-footer">' +
        '<button class="prp-btn prp-btn-secondary" onclick="PaymentRefundPrompt.close()">Not now</button>' +
        '<button class="prp-btn prp-btn-danger" id="prp_confirm">Refund ' +
        ctx.refundableAmountDisplay +
        "</button>" +
        "</div></div>";

      document.body.appendChild(overlay);

      document.getElementById("prp_confirm").onclick = function () {
        submit(ctx, options);
      };
    }

    function submit(ctx, options) {
      var button = document.getElementById("prp_confirm");
      var error = document.getElementById("prp_error");
      var rupees = Number(document.getElementById("prp_amount").value);
      var reason = document.getElementById("prp_reason").value;
      var remarks = document.getElementById("prp_remarks").value;

      function fail(message) {
        error.textContent = message;
        error.style.color = "#b02a37";
        button.disabled = false;
        button.textContent = "Refund " + ctx.refundableAmountDisplay;
      }

      if (!rupees || rupees <= 0) return fail("Enter a refund amount.");
      if (rupees * 100 > ctx.refundableAmountPaise) {
        return fail(
          "Amount exceeds the refundable balance of " + ctx.refundableAmountDisplay + "."
        );
      }
      if (!reason) return fail("Select a refund reason.");

      button.disabled = true;
      button.textContent = "Processing...";
      error.textContent = "Contacting the payment provider...";
      error.style.color = "#6b7280";

      google.script.run
        .withSuccessHandler(function (result) {
          if (!result || !result.success) {
            return fail((result && result.message) || "Refund failed.");
          }
          close();
          // Hand the patient message to reception to send.
          if (result.patientMessage) window.open(result.patientMessage.waLink, "_blank");
          if (typeof showAlert === "function") {
            showAlert(result.message, "success");
          }
          if (options.onDone) options.onDone();
        })
        .withFailureHandler(function (err) {
          fail("Refund failed: " + err.message);
        })
        .initiateRefund({
          paymentRef: ctx.paymentRef,
          amountPaise: Math.round(rupees * 100),
          reason: reason,
          remarks: remarks,
          sessionToken: token(),
        });
    }

    function close() {
      var overlay = document.getElementById("prpOverlay");
      if (overlay) overlay.remove();
    }

    return { handle: handle, open: open, close: close };
  })();
</script>
